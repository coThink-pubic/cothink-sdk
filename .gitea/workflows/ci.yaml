name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4.2.2
      - name: Clone sibling repos
        env:
          TOKEN: ${{ secrets.ORG_CLONE_PAT }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          PARENT="$(dirname "$ROOT")"
          clone_sib() {
            local name="$1"
            rm -rf "$ROOT/$name"
            git clone --depth 1 "https://oauth2:${TOKEN}@git.ncdlabs.com/coThink/${name}.git" "$ROOT/$name"
            ln -sfn "$ROOT/$name" "$PARENT/$name"
          }
          clone_sib platform-testing
          ln -sfn "$ROOT" "$PARENT/cothink-sdk"
      - uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: https://github.com/actions/setup-node@v4.3.0
        with:
          node-version: '22'
      - name: Prefer action-setup pnpm over Corepack
        run: |
          set -e
          corepack disable || true
          hash -r || true
          command -v pnpm
          pnpm -v
      - name: Install and build SDK
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Install and build platform-testing
        run: pnpm --dir platform-testing install --frozen-lockfile && pnpm --dir platform-testing run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
