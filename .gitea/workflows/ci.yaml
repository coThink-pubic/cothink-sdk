name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: campusrose-macos
    steps:
      - uses: https://github.com/actions/checkout@v4.2.2
      - uses: https://github.com/actions/checkout@v4.2.2
        with:
          repository: coThink/platform-testing
          ref: main
          path: platform-testing
          token: ${{ secrets.ORG_CLONE_PAT || secrets.COTHINK_GITEA_TOKEN || github.token }}
      - name: Symlink sibling paths
        run: |
          set -e
          ROOT="$(pwd)"
          PARENT="$(dirname "$ROOT")"
          ln -sfn "$ROOT/platform-testing" "$PARENT/platform-testing"
          ln -sfn "$ROOT" "$PARENT/cothink-sdk"
      - uses: https://github.com/pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: https://github.com/actions/setup-node@v4.3.0
        with:
          node-version: '22'
      - name: Disable Corepack
        run: if command -v corepack >/dev/null 2>&1; then corepack disable; fi
      - name: Install and build SDK
        run: pnpm install --frozen-lockfile && pnpm run build
      - name: Install and build platform-testing
        run: pnpm --dir platform-testing install --frozen-lockfile && pnpm --dir platform-testing run build
      - name: Typecheck
        run: pnpm run typecheck
      - name: Test
        run: pnpm run test
