name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: k3s-linux
    steps:
      - uses: https://github.com/actions/checkout@v4.2.2

      - name: Install Node 22 (musl-aware for k3s hostexecutor)
        run: |
          set -euo pipefail
          export PATH="$(ls -d "$HOME"/.local/node-*/bin 2>/dev/null | sort -V | tail -1):$PATH"
          ver="22.23.2"
          arch="$(uname -m)"
          case "$arch" in
            x86_64) node_arch=x64 ;;
            aarch64|arm64) node_arch=arm64 ;;
            *) echo "unsupported arch: $arch"; exit 1 ;;
          esac
          if [ -f /etc/alpine-release ] || (ldd /bin/sh 2>&1 | grep -qi musl); then
            url="https://unofficial-builds.nodejs.org/download/release/v${ver}/node-v${ver}-linux-${node_arch}-musl.tar.gz"
            prefix="$HOME/.local/node-v${ver}-linux-${node_arch}-musl"
          else
            url="https://nodejs.org/dist/v${ver}/node-v${ver}-linux-${node_arch}.tar.gz"
            prefix="$HOME/.local/node-v${ver}-linux-${node_arch}"
          fi
          mkdir -p "$HOME/.local"
          if [ ! -x "$prefix/bin/node" ]; then
            tmp="$(mktemp -d)"
            curl -fsSL "$url" -o "$tmp/node.tar.gz"
            tar -xzf "$tmp/node.tar.gz" -C "$HOME/.local"
            rm -rf "$tmp"
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          export PATH="$prefix/bin:$PATH"
          node -v

      - name: Disable Corepack so local pnpm is used
        run: |
          if command -v corepack >/dev/null 2>&1; then corepack disable; fi
      - name: Install pnpm matching packageManager into PATH prefix
        run: |
          set -euo pipefail
          export PATH="$(ls -d "$HOME"/.local/node-*/bin 2>/dev/null | sort -V | tail -1):$PATH"
          pm="$(node -p "require('./package.json').packageManager || ''" 2>/dev/null || true)"
          case "$pm" in
            pnpm@*) ver="${pm#pnpm@}" ;;
            *) ver="9.15.4" ;;
          esac
          prefix="${RUNNER_TEMP:-/tmp}/pnpm-prefix-${GITHUB_RUN_ID:-$$}"
          mkdir -p "$prefix"
          npm install --prefix "$prefix" "pnpm@${ver}"
          echo "$prefix/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$(dirname "$(command -v node)")" >> "$GITHUB_PATH"
          export PATH="$prefix/node_modules/.bin:$(dirname "$(command -v node)"):$PATH"
          hash -r || true
          command -v pnpm
          pnpm -v

      - name: Clone sibling repos
        env:
          TOKEN: ${{ secrets.ORG_CLONE_PAT }}
        run: |
          set -euo pipefail
          ROOT="$(pwd)"
          PARENT="$(dirname "$ROOT")"
          if [ -z "${TOKEN:-}" ]; then
            echo "ORG_CLONE_PAT secret is empty" >&2
            exit 1
          fi
          clone_sib() {
            local name="$1"
            rm -rf "$ROOT/$name"
            git clone --depth 1 "https://oauth2:${TOKEN}@git.ncdlabs.com/coThink/${name}.git" "$ROOT/$name"
            ln -sfn "$ROOT/$name" "$PARENT/$name"
          }
          for name in platform-testing; do
            clone_sib "$name"
          done
          ln -sfn "$ROOT" "$PARENT/cothink-sdk"
      - name: Build and test (host flock)
        run: |
          set -euo pipefail
          export PATH="$(ls -d "$HOME"/.local/node-*/bin 2>/dev/null | sort -V | tail -1):$PATH"
          lock=/tmp/cothink-k3s-ci.lock
          flock "$lock" env PATH="$PATH" bash -c '
            set -euo pipefail
            export PATH="$PATH"
            hash -r || true
            command -v node
            command -v pnpm
            node -v
            pnpm -v
            export npm_config_engine_strict=false
            pnpm config set engine-strict false || true
            pnpm install --frozen-lockfile
            pnpm run build
            pnpm --dir platform-testing install --frozen-lockfile
            pnpm --dir platform-testing run build
            pnpm run typecheck
            pnpm run test
          '
